# Building a release, on a tag.
#
# Every artifact is made by `common/tools/release.sh`, which is also what a laptop runs; this
# file only says where each part of it runs and what to do with what comes out. Nothing about
# how an artifact is built lives here, so a tag and a laptop cannot produce different things.
#
#   macOS builds need a Mac, for Apple's linker and install_name_tool.
#   Windows and Switch builds need only Docker, because their toolchains are in containers.
#
# Push a tag like `v1.0.0` and the release appears as a draft with everything attached. It is a
# draft on purpose: someone should read the notes and look at the list before it is public.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-14          # Apple silicon; SDL comes from Homebrew
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl3
      - name: Build the macOS artifacts
        run: common/tools/release.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/${{ needs.version.outputs.version }}/*-macos.zip
          if-no-files-found: error

  windows-and-switch:
    needs: version
    runs-on: ubuntu-latest     # both toolchains are containers, so no Windows runner is needed
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows and Switch artifacts, and the source tarball
        run: common/tools/release.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-switch-source
          path: |
            release/${{ needs.version.outputs.version }}/*-windows-x64.zip
            release/${{ needs.version.outputs.version }}/*-switch.zip
            release/${{ needs.version.outputs.version }}/*-source.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, macos, windows-and-switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: downloaded }
      - name: Gather everything and checksum it
        run: |
          mkdir -p upload
          find downloaded -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          cd upload && sha256sum ./* | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          # Written to a file rather than passed inline: the notes are several paragraphs, and
          # a heredoc nested inside an inline `$(...)` would end this YAML block rather than the
          # heredoc. YAML strips this block's own indentation, so the terminator lands flush.
          cat > notes.md <<'NOTES'
          Every game needs its own files from your iPod. No download here contains them, and
          each artifact's `README.txt` says which folder it wants and where to put it.

          Building from the source tarball takes one more step for every title except Mini Golf:
          run `python3 tools/funcs.py && python3 tools/emit.py` in that title's directory first,
          against your own copy of that game. What those write is a translation of the game's
          own binary, so it is not in the repository. See `RELEASING.md`.
          NOTES
          gh release create "v$version" upload/* \
            --draft --title "v$version" --notes-file notes.md
