[package]
name = "eapp-loader"
version.workspace = true
edition = "2021"
description = "Load an iPod eApp binary, resolve its framework imports to traps, and trace the calls"

[dependencies]
arm7tdmi = { path = "../arm7tdmi" }

[dependencies.minifb]
version = "0.27"
optional = true

[features]
viewer = ["minifb"]

[[bin]]
name = "play"
required-features = ["viewer"]
